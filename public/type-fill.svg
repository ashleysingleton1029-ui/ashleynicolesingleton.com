<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b12"/>
      <stop offset="0.5" stop-color="#18121c"/>
      <stop offset="1" stop-color="#05050a"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1600" height="600" fill="url(#base)"/>

  <!-- motion streaks -->
  <g filter="url(#blur)" opacity="0.95">
    <rect x="-200" y="60"  width="2000" height="60"  fill="#ec4899" opacity="0.85" transform="rotate(-8 800 300)"/>
    <rect x="-200" y="150" width="2000" height="26"  fill="#ffffff" opacity="0.55" transform="rotate(-8 800 300)"/>
    <rect x="-200" y="230" width="2000" height="90"  fill="#2563eb" opacity="0.75" transform="rotate(-8 800 300)"/>
    <rect x="-200" y="340" width="2000" height="40"  fill="#f59e0b" opacity="0.8"  transform="rotate(-8 800 300)"/>
    <rect x="-200" y="410" width="2000" height="120" fill="#be123c" opacity="0.85" transform="rotate(-8 800 300)"/>
    <rect x="-200" y="520" width="2000" height="30"  fill="#ec4899" opacity="0.7"  transform="rotate(-8 800 300)"/>
  </g>

  <!-- speckle highlights -->
  <g fill="#ffffff" opacity="0.5">
    <rect x="180" y="120" width="60" height="8"/>
    <rect x="620" y="300" width="120" height="6"/>
    <rect x="1040" y="200" width="90" height="7"/>
    <rect x="1320" y="440" width="140" height="6"/>
    <rect x="420" y="470" width="80" height="5"/>
  </g>

  <rect width="1600" height="600" filter="url(#grain)" opacity="0.6"/>
</svg>
