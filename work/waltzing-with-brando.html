<!doctype html>
<html lang="en">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

</head>
<body class="credit credit--expand">

  <!-- Top bar -->
  <header class="credit-nav">
    <a href="../index.html" class="credit-nav__brand" aria-label="Ashley Nicole Singleton — home">
      <span class="nav__brandMark">ANS</span>
      <span class="credit-nav__name">Ashley Nicole Singleton</span>
    </a>
    <a href="../index.html#work" class="credit-nav__back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      <span>All Work</span>
    </a>
  </header>

  <main class="credit-main">

    <!-- Scroll-to-expand hero -->
    <section class="expand" data-expand aria-label="Waltzing with Brando">
      <div class="expand__bg" style="background-image:url('../img/work/waltzing-with-brando-bg.jpg'); background-position:78% 40%" aria-hidden="true"></div>

      <div class="expand__stage">
        <figure class="expand__media" style="background:#EAB63E">
          <img src="../img/work/waltzing-with-brando-hero.jpg" width="2000" height="1125"
               style="object-fit:contain; object-position:center"
               alt="Waltzing with Brando film key art featuring Marlon Brando" />
          <span class="expand__mscrim" aria-hidden="true"></span>
        </figure>

        <h1 class="expand__title">
          <span class="expand__word expand__word--l">Waltzing</span>
          <span class="expand__word expand__word--r">with Brando</span>
        </h1>

        <div class="expand__chrome">
          <p class="expand__date">Premiere · Red Carpet</p>
          <p class="expand__hint">Scroll to expand</p>
        </div>
      </div>
    </section>

    <!-- Revealed once fully expanded -->
    <div class="expand-content">
      <div class="expand-content__inner">
        <p class="overline"><span>( 02 )</span><span>Selected Work</span></p>

        <!-- TODO: fill in meta + overview.
        <div class="credit-meta">
          <div class="credit-meta__item"><span class="overline">Role</span><p>Red Carpet Host</p></div>
          <div class="credit-meta__item"><span class="overline">Format</span><p>Premiere</p></div>
          <div class="credit-meta__item"><span class="overline">Presented by</span><p>OPTIX Film Series</p></div>
        </div>
        -->

        <div class="credit-overview">
          <p>Full credit details coming soon.</p>
        </div>
      </div>

      <!-- Interview reels — add a .reel-card per reel (Instagram /embed on click) -->
      <section class="reel-gallery" aria-label="Premiere reels">
        <div class="reel-gallery__head">
          <h2 class="reel-gallery__title">On the Carpet</h2>
          <span class="reel-gallery__count">Premiere</span>
        </div>
        <div class="reel-grid">
          <button type="button" class="reel-card"
                  data-embed="https://www.instagram.com/p/DNjx9-mxgcW/embed/"
                  data-href="https://www.instagram.com/p/DNjx9-mxgcW/"
                  aria-label="Play reel: interview with Billy Zane at the Waltzing with Brando premiere">
            <img src="../img/work/reels/waltzing-01.jpg" width="1500" height="2000" loading="lazy"
                 alt="Ashley with Billy Zane at the Waltzing with Brando premiere" />
            <span class="reel-card__scrim" aria-hidden="true"></span>
            <span class="reel-card__tag" aria-hidden="true">▶ Reel</span>
            <span class="reel-card__play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
            <span class="reel-card__cap">Interview with Billy Zane</span>
          </button>
          <button type="button" class="reel-card"
                  data-embed="https://www.instagram.com/p/DNmCIygSLqm/embed/"
                  data-href="https://www.instagram.com/p/DNmCIygSLqm/"
                  aria-label="Play reel: interview with Jon Heder at the Waltzing with Brando premiere">
            <img src="../img/work/reels/waltzing-02.jpg" width="1500" height="2000" loading="lazy"
                 alt="Ashley with Jon Heder at the Waltzing with Brando premiere" />
            <span class="reel-card__scrim" aria-hidden="true"></span>
            <span class="reel-card__tag" aria-hidden="true">▶ Reel</span>
            <span class="reel-card__play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
            <span class="reel-card__cap">Interview with Jon Heder</span>
          </button>
          <button type="button" class="reel-card"
                  data-embed="https://www.instagram.com/p/DNlUHTORpwR/embed/"
                  data-href="https://www.instagram.com/p/DNlUHTORpwR/"
                  aria-label="Play reel: interview with Tia Carrere at the Waltzing with Brando premiere">
            <img src="../img/work/reels/waltzing-03.jpg" width="1500" height="2000" loading="lazy"
                 alt="Ashley with Tia Carrere at the Waltzing with Brando premiere" />
            <span class="reel-card__scrim" aria-hidden="true"></span>
            <span class="reel-card__tag" aria-hidden="true">▶ Reel</span>
            <span class="reel-card__play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
            <span class="reel-card__cap">Interview with Tia Carrere</span>
          </button>
        </div>
      </section>

      <nav class="credit-foot" aria-label="Work navigation">
        <a href="../index.html#work" class="credit-foot__all">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
          <span>All Work</span>
        </a>
      </nav>

      <footer class="footer">
        <div class="footer__row">
          <span>© <span id="year">2026</span> Ashley Nicole Singleton</span>
          <span>Las Vegas · On Air</span>
          <a href="../index.html">Home ↑</a>
        </div>
      </footer>
    </div>
  </main>

  <!-- Reel lightbox -->
  <div class="reel-lb" id="reelLb" role="dialog" aria-modal="true" aria-label="Premiere reel" hidden>
    <div class="reel-lb__frame">
      <div class="reel-lb__spinner" aria-hidden="true">Loading…</div>
      <iframe title="Instagram reel" allow="autoplay; encrypted-media; clipboard-write; picture-in-picture" allowfullscreen loading="lazy"></iframe>
      <button type="button" class="reel-lb__close" aria-label="Close reel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
  <script src="../js/credit-expand.js" defer></script>
</body>
</html>
