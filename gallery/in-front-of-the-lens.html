  <style>
    /* Moody, cinematic theme — scoped to this gallery page only. */
    body.credit { background: #0b0c0d; color: var(--paper); }

    /* Dark frosted nav + footer rule to match the mood */
    .credit-nav { background: rgba(11, 12, 13, 0.62); border-bottom: 1px solid var(--line-dark); }
    .credit-nav__brand .nav__brandMark { color: var(--paper); }
    .credit-nav__name { color: var(--muted-dark); }
    .credit-foot { border-top: 1px solid var(--line-dark); }

    /* Full-bleed cinematic hero */
    .lens-hero { position: relative; width: 100%; overflow: hidden; background: #000; }
    .lens-hero__img {
      display: block; width: 100%; height: min(88vh, 60vw); min-height: 420px;
      object-fit: cover; object-position: center 42%;
    }
    .lens-hero__scrim {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(to top, rgba(6,7,8,0.94) 0%, rgba(6,7,8,0.55) 24%, rgba(6,7,8,0.05) 55%, rgba(6,7,8,0) 80%);
    }
    .lens-hero__cap { position: absolute; left: 0; right: auto; bottom: 0; max-width: min(620px, 60vw); padding: clamp(26px, 6vh, 64px) clamp(20px, 5vw, 72px); }
    .lens-hero__cap .overline { color: var(--gold); margin-bottom: 12px; }
    .lens-hero__title {
      font-family: var(--font-display); font-weight: 900; text-transform: uppercase; color: var(--paper);
      font-size: clamp(2rem, 4vw, 3.4rem); line-height: 0.92; letter-spacing: -0.02em;
      margin: 0 0 clamp(14px, 2vh, 22px); text-shadow: 0 12px 60px rgba(0,0,0,0.55);
    }
    /* "Smoked glass" box so the description stays legible over the photo */
    .lens-hero__box {
      display: block; max-width: 66ch;
      background: rgba(9,10,12,0.44);
      -webkit-backdrop-filter: blur(14px) saturate(0.85); backdrop-filter: blur(14px) saturate(0.85);
      border: 1px solid rgba(244,242,236,0.14); border-radius: 0;
      padding: clamp(15px, 2.1vw, 23px) clamp(18px, 2.6vw, 30px);
      box-shadow: 0 26px 64px rgba(0,0,0,0.5);
    }
    .lens-hero__text { font-family: var(--font-body); color: var(--paper); font-size: clamp(1rem, 1.45vw, 1.26rem); line-height: 1.55; margin: 0; }

    .photo-gallery { padding-top: clamp(44px, 7vh, 92px); }

    @media (max-width: 640px) {
      /* Keep the photo clean and move the caption below it, so the hero
         isn't busy on small screens. */
      .lens-hero__img { height: min(56vh, 108vw); object-position: center 42%; }
      .lens-hero__scrim { display: none; }
      .lens-hero__cap { position: static; padding: clamp(22px, 5vh, 34px) var(--gutter) 0; }
      .lens-hero__cap .overline { margin-bottom: 12px; }
      .lens-hero__title { font-size: clamp(2.3rem, 11vw, 3.2rem); text-shadow: none; margin-bottom: 16px; }
      .lens-hero__box { max-width: none; background: none; -webkit-backdrop-filter: none; backdrop-filter: none; border: 0; border-radius: 0; padding: 0; box-shadow: none; }
    }
  </style>
