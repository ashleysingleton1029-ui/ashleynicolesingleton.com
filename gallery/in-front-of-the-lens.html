  <style>
    /* Moody, cinematic theme — scoped to this gallery page only. */
    body.credit { background: #0b0c0d; color: var(--paper); }

    /* Dark frosted nav + footer rule to match the mood */
    .credit-nav { background: rgba(11, 12, 13, 0.62); border-bottom: 1px solid var(--line-dark); }
    .credit-nav__brand .nav__brandMark { color: var(--paper); }
    .credit-nav__name { color: var(--muted-dark); }
    .credit-foot { border-top: 1px solid var(--line-dark); }

    /* Full-bleed cinematic hero */
    .lens-hero { position: relative; width: 100%; overflow: hidden; background: #000; }
    .lens-hero__img {
      display: block; width: 100%; height: min(92vh, 66vw); min-height: 440px;
      object-fit: cover; object-position: center 30%;
      /* Hidden until the video ends (or fails) so it never flashes before the
         video paints; the hero's black background shows during buffering. */
      opacity: 0; transition: opacity 0.8s var(--ease);
    }
    .lens-hero.is-ended .lens-hero__img { opacity: 1; }
    /* Video overlays the image with identical framing; fades out once it ends. */
    .lens-hero__video {
      position: absolute; top: 0; left: 0; width: 100%; height: min(92vh, 66vw); min-height: 440px;
      object-fit: cover; object-position: center 30%; z-index: 1;
      opacity: 1; transition: opacity 0.8s var(--ease);
    }
    .lens-hero.is-ended .lens-hero__video { opacity: 0; }
    /* Reduced motion: skip the video, just show the static image. */
    @media (prefers-reduced-motion: reduce) { .lens-hero__video { display: none; } .lens-hero__img { opacity: 1 !important; } }
    .lens-hero__scrim {
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background: linear-gradient(to top, rgba(6,7,8,0.94) 0%, rgba(6,7,8,0.55) 24%, rgba(6,7,8,0.05) 55%, rgba(6,7,8,0) 80%);
    }
    .lens-hero__cap { position: absolute; left: 0; right: auto; bottom: 0; z-index: 3; max-width: min(620px, 60vw); padding: clamp(26px, 6vh, 64px) clamp(20px, 5vw, 72px); }
    .lens-hero__cap .overline { color: var(--gold); margin-bottom: 12px; }
    .lens-hero__title {
      font-family: var(--font-display); font-weight: 900; text-transform: uppercase; color: var(--paper);
      font-size: clamp(2rem, 4vw, 3.4rem); line-height: 0.92; letter-spacing: -0.02em;
      margin: 0 0 clamp(14px, 2vh, 22px); text-shadow: 0 12px 60px rgba(0,0,0,0.55);
    }
    /* "the Lens" reads larger than "In Front of" for a bit of wow. */
    .lens-hero__title span { display: block; }
    .lens-hero__l2 { font-size: 1.34em; }
    /* "Smoked glass" box so the description stays legible over the photo */
    .lens-hero__box {
      display: block; max-width: 48ch;
      background: rgba(9,10,12,0.44);
      -webkit-backdrop-filter: blur(14px) saturate(0.85); backdrop-filter: blur(14px) saturate(0.85);
      border: 1px solid rgba(244,242,236,0.14); border-radius: 0;
      padding: clamp(13px, 1.8vw, 19px) clamp(15px, 2.2vw, 25px);
      /* Offset the box left by its own left padding so the TEXT (not the box
         edge) lines up with the overline and title above it. */
      margin-left: calc(-1 * clamp(15px, 2.2vw, 25px));
      box-shadow: 0 26px 64px rgba(0,0,0,0.5);
    }
    .lens-hero__text { font-family: var(--font-body); color: var(--paper); font-size: clamp(0.9rem, 1.15vw, 1.05rem); line-height: 1.55; margin: 0; }

    /* Scroll cue with the moving gold light — matches the homepage hero. */
    .lens-hero__scroll {
      position: absolute; bottom: clamp(20px, 4vh, 42px); left: 50%; transform: translateX(-50%); z-index: 3;
      display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none;
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--paper);
    }
    .lens-hero__scroll i { width: 1px; height: 46px; background: rgba(244, 242, 236, 0.35); position: relative; overflow: hidden; }
    .lens-hero__scroll i::after { content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 14px; background: linear-gradient(var(--gold), transparent); animation: scrollLine 1.9s var(--ease) infinite; }
    @media (prefers-reduced-motion: reduce) { .lens-hero__scroll i::after { animation: none; } }

    .photo-gallery { padding-top: clamp(44px, 7vh, 92px); }

    @media (max-width: 640px) {
      /* Keep the photo clean and move the caption below it, centered, so it
         reads as a balanced, impactful block rather than left-heavy. */
      .lens-hero__img { height: min(56vh, 108vw); object-position: center 42%; }
      .lens-hero__video { height: min(56vh, 108vw); object-position: center 42%; }
      .lens-hero__scrim { display: none; }
      .lens-hero__scroll { display: none; }
      /* Symmetric caption padding + no extra gallery top padding so the caption
         block sits balanced between the photo above and the grid below. */
      .lens-hero__cap { position: static; max-width: none; text-align: center; padding: clamp(34px, 6vh, 48px) var(--gutter); }
      .lens-hero__cap .overline { justify-content: center; margin-bottom: 16px; }
      .lens-hero__title { font-size: clamp(1.8rem, 8vw, 2.7rem); line-height: 1; text-shadow: none; margin: 0 auto 20px; }
      .lens-hero__box { max-width: 32ch; margin: 0 auto; background: none; -webkit-backdrop-filter: none; backdrop-filter: none; border: 0; border-radius: 0; padding: 0; box-shadow: none; }
      .lens-hero__text { font-size: clamp(1rem, 4.4vw, 1.18rem); }
      .photo-gallery { padding-top: 0; }
    }
  </style>

  <!-- Hero: play the intro video once, then fade to the static image. -->
  <script>
    (function () {
      var v = document.getElementById('lensHeroVideo');
      if (!v) return;
      var hero = v.closest('.lens-hero');
      if (!hero) return;
      var done = false;
      var reveal = function () { if (done) return; done = true; hero.classList.add('is-ended'); };
      var started = false;
      v.addEventListener('playing', function () { started = true; });
      v.addEventListener('timeupdate', function () { if (v.currentTime > 0.1) started = true; });
      v.addEventListener('ended', reveal);
      v.addEventListener('error', reveal);          // can't load -> show the image
      var p = v.play && v.play();                   // nudge autoplay (muted autoplay is allowed)
      if (p && p.catch) p.catch(reveal);            // autoplay blocked -> show the image
      // Safety: if the video never starts within a few seconds, show the image.
      setTimeout(function () { if (!started) reveal(); }, 6000);
    })();
  </script>
